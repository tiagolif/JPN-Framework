name: JPN SDK CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: jpn-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Compile SDK and browser bundle
        run: |
          npx tsc -p tsconfig.json
          npm run build:browser

      - name: Prompt Builder gates
        run: |
          npm run check:product-site
          npm run check:prompt-builder-presets
          npm run check:prompt-builder-custom-presets
          npm run check:prompt-builder-workspaces
          npm run check:prompt-builder-recovery
          npm run check:prompt-builder-context-regressions
          npm run check:prompt-builder-staging
          npm run check:prompt-builder-quick-start

      - name: Core - product consistency
        run: npm run check:product-consistency

      - name: Core - Metodo cross-product
        run: npm run check:metodo-cross-product

      - name: Core - Business links
        run: npm run check:jpn-business-links

      - name: Core - Prompt Pack QA
        run: npm run check:prompt-pack-qa

      - name: Core - Prompt Pack selection workbook
        run: npm run check:prompt-pack-selection-workbook

      - name: Core - Business print candidate
        run: npm run check:jpn-business-print-candidate

      - name: Core - editorial hygiene
        run: npm run check:core-editorial-hygiene

      - name: Core - terminology
        run: npm run check:core-terminology

      - name: Portfolio - comparison matrix
        run: node scripts/check-product-comparison-matrix.mjs

      - name: Portfolio - commercial surface manifest
        run: node scripts/check-commercial-surface-manifest.mjs

      - name: Core - product portfolio
        run: npm run check:product-portfolio

      - name: Core - deliverable catalog
        run: npm run check:deliverable-catalog

      - name: Core - product release status
        run: npm run check:product-release-status

      - name: Release and Pro Kit gates
        run: |
          npm run check:release-execution-plan
          npm run check:human-release-workbench
          npm run check:release-runbook
          npm run check:release-action-queue
          npm run check:product-readiness-report
          npm run check:pro-kit
          npm run check:pro-kit-manifest
          npm run check:pro-kit-staging

      - name: Visual and editorial gates
        run: |
          npm run check:visual-assets
          npm run check:visual-bounds
          npm run check:editorial-release
          npm run check:editorial-review-handoff

      - name: Commercial gates
        run: |
          npm run check:commercial-copy
          npm run check:commercial-product-facts
          npm run check:sales-enablement-playbook
          npm run check:commercial-faq
          npm run check:commercial-site
          npm run check:commercial-use-cases
          npm run check:commercial-navigation
          npm run check:commercial-accessibility
          npm run check:commercial-contrast

      - name: Gestão Fácil gates
        run: |
          npm run check:gestao-facil-model
          npm run check:gestao-facil-binary

      - name: Generated review artifacts
        run: |
          npm run report:release-readiness
          npm run build:visual-review
          npm run check:visual-review-gallery
          npm run build:editorial-print
          npm run check:editorial-print-staging
          npm run build:jpn-business-print-candidate
          npm run check:jpn-business-rendered-candidate
          npm run stage:prompt-builder

      - name: Verify tracked generated files are synchronized
        run: git diff --exit-code
