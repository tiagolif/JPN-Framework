name: JPN SDK CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: jpn-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Compile SDK and browser bundle
        run: |
          npx tsc -p tsconfig.json
          npm run build:browser

      - name: CI contract - stacked PR coverage
        run: node scripts/check-stacked-pr-ci.mjs

      - name: Prompt Builder gates
        run: |
          npm run check:product-site
          npm run check:prompt-builder-presets
          npm run check:prompt-builder-custom-presets
          npm run check:prompt-builder-workspaces
          npm run check:prompt-builder-recovery
          npm run check:prompt-builder-context-regressions
          npm run check:prompt-builder-staging
          npm run check:prompt-builder-quick-start

      - name: Core - product consistency
        run: npm run check:product-consistency

      - name: Core - Metodo cross-product
        run: npm run check:metodo-cross-product

      - name: Core - Business links
        run: npm run check:jpn-business-links

      - name: Core - Prompt Pack QA
        run: npm run check:prompt-pack-qa

      - name: Core - Prompt Pack selection workbook
        run: npm run check:prompt-pack-selection-workbook

      - name: Core - Business print candidate
        run: npm run check:jpn-business-print-candidate

      - name: Core - editorial hygiene
        run: npm run check:core-editorial-hygiene

      - name: Core - terminology
        run: npm run check:core-terminology

      - name: Portfolio - comparison matrix
        run: node scripts/check-product-comparison-matrix.mjs

      - name: Portfolio - commercial surface manifest
        run: node scripts/check-commercial-surface-manifest.mjs

      - name: Core - product portfolio
        run: npm run check:product-portfolio

      - name: Core - deliverable catalog
        run: npm run check:deliverable-catalog

      - name: Core - product release status
        run: npm run check:product-release-status

      - name: Customer delivery - package and handoff
        run: |
          node scripts/check-product-delivery-manifests.mjs
          node scripts/check-customer-package-contract.mjs
          node scripts/check-delivery-handoff-guide.mjs
          node scripts/check-customer-onboarding.mjs
          node scripts/check-customer-support-playbook.mjs
          node scripts/check-safe-data-handling.mjs

      - name: Commercial operations - discovery and onboarding
        run: node scripts/check-sales-discovery-guide.mjs

      - name: Commercial operations - guided demo
        run: node scripts/check-guided-demo-playbook.mjs

      - name: Commercial operations - onboarding
        run: node scripts/check-commercial-onboarding.mjs

      - name: Commercial operations - small business diagnostic
        run: node scripts/check-small-business-diagnostic.mjs

      - name: Commercial operations - FAQ and objections
        run: node scripts/check-product-faq-objections.mjs

      - name: Distribution - package routing
        run: |
          node scripts/check-product-distribution-index.mjs
          node scripts/check-product-distribution-source-map.mjs
          node scripts/check-product-feedback-loop.mjs

      - name: Release evidence - integrity
        run: |
          node scripts/check-release-evidence-contract.mjs
          node scripts/check-release-evidence-register.mjs

      - name: Release and Pro Kit gates
        run: |
          npm run check:release-execution-plan
          npm run check:human-release-workbench
          npm run check:release-runbook
          npm run check:release-action-queue
          npm run check:product-readiness-report
          npm run check:pro-kit
          npm run check:pro-kit-manifest
          npm run check:pro-kit-staging

      - name: Visual - assets
        run: npm run check:visual-assets

      - name: Visual - bounds
        run: npm run check:visual-bounds

      - name: Editorial - release
        run: npm run check:editorial-release

      - name: Editorial - review handoff
        run: npm run check:editorial-review-handoff

      - name: Editorial - PDF visual handoff contract
        run: node scripts/check-editorial-pdf-visual-review-handoff.mjs

      - name: Commercial copy - social content
        run: node scripts/check-social-content-library.mjs

      - name: Commercial copy - one-pagers
        run: node scripts/check-commercial-one-pagers.mjs

      - name: Commercial copy - product page copy
        run: node scripts/check-product-page-copy.mjs

      - name: Commercial copy - page copy sync
        run: node scripts/check-commercial-page-copy-sync.mjs

      - name: Commercial - copy
        run: npm run check:commercial-copy

      - name: Commercial - product facts
        run: npm run check:commercial-product-facts

      - name: Commercial - sales enablement playbook
        run: npm run check:sales-enablement-playbook

      - name: Commercial - FAQ
        run: npm run check:commercial-faq

      - name: Commercial - diagnostic
        run: node scripts/check-commercial-diagnostic-ui.mjs

      - name: Commercial - site
        run: npm run check:commercial-site

      - name: Commercial - use cases
        run: npm run check:commercial-use-cases

      - name: Commercial - navigation
        run: npm run check:commercial-navigation

      - name: Commercial - accessibility
        run: npm run check:commercial-accessibility

      - name: Commercial - contrast
        run: npm run check:commercial-contrast

      - name: Commercial - creative review aggregate
        run: npm run check:commercial-creative-review

      - name: Commercial - editable creative sources
        run: node scripts/check-commercial-creative-sources.mjs

      - name: Commercial - creative review gallery
        run: node scripts/check-commercial-creative-gallery.mjs

      - name: Commercial - creative review manifest build
        run: node scripts/build-commercial-creative-review-manifest.mjs

      - name: Commercial - creative review manifest check
        run: node scripts/check-commercial-creative-review-manifest.mjs

      - name: Commercial - creative review protocol
        run: node scripts/check-commercial-creative-review-protocol.mjs

      - name: Commercial - creative human review handoff
        run: node scripts/check-commercial-creative-human-review-handoff.mjs

      - name: Gestão Fácil - quick start
        run: node scripts/check-gestao-facil-quick-start.mjs

      - name: Gestão Fácil - data dictionary
        run: node scripts/check-gestao-facil-data-dictionary.mjs

      - name: Gestão Fácil - starter data kit
        run: node scripts/check-gestao-facil-starter-data-kit.mjs

      - name: Gestão Fácil - operating guide
        run: node scripts/check-gestao-facil-operating-guide.mjs

      - name: Gestão Fácil - v0.3 candidate
        run: node scripts/check-gestao-facil-v0.3-candidate.mjs

      - name: Gestão Fácil - v0.2 candidate chain
        run: node scripts/check-gestao-facil-v0.2-candidate.mjs

      - name: Gestão Fácil - model
        run: npm run check:gestao-facil-model

      - name: Gestão Fácil - binary
        run: npm run check:gestao-facil-binary

      - name: Generated review artifacts
        run: npm run report:release-readiness

      - name: Generated review - visual gallery build
        run: npm run build:visual-review

      - name: Generated review - visual gallery check
        run: npm run check:visual-review-gallery

      - name: Generated review - editorial print build
        run: npm run build:editorial-print

      - name: Generated review - editorial print check
        run: npm run check:editorial-print-staging

      - name: Generated review - Business print build
        run: npm run build:jpn-business-print-candidate

      - name: Generated review - Business rendered check
        run: npm run check:jpn-business-rendered-candidate

      - name: Generated review - Prompt Builder stage
        run: npm run stage:prompt-builder

      - name: Verify tracked generated files are synchronized
        run: git diff --exit-code
