<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc"><title id="title">JPN Business — Story 3 de 4</title><desc id="desc">Organize fluxo e saída com playbook revisável.</desc><rect width="1080" height="1920" fill="#06121C"/><rect x="72" y="120" width="936" height="1680" rx="40" fill="#0B1F33" stroke="#21455E" stroke-width="2"/><text x="120" y="220" fill="#86E2D9" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="800">JPN · BUSINESS · 3/4</text><text x="120" y="570" fill="#F5F9FC" font-family="Inter,Arial,sans-serif" font-size="64" font-weight="900">Transforme a tarefa</text><text x="120" y="660" fill="#F5F9FC" font-family="Inter,Arial,sans-serif" font-size="64" font-weight="900">em processo revisável.</text><text x="120" y="860" fill="#A7BDCC" font-family="Inter,Arial,sans-serif" font-size="32">Contexto → responsável → critérios</text><text x="120" y="920" fill="#86E2D9" font-family="Inter,Arial,sans-serif" font-size="32">→ prompt → revisão → próxima ação</text><text x="120" y="1080" fill="#A7BDCC" font-family="Inter,Arial,sans-serif" font-size="30">Playbook apoia a decisão humana.</text><line x1="120" y1="1510" x2="960" y2="1510" stroke="#21455E" stroke-width="2"/><text x="120" y="1700" fill="#A7BDCC" font-family="Inter,Arial,sans-serif" font-size="22">Arte interna · não publicada</text></svg>