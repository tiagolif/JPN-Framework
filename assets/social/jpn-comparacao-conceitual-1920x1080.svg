<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">Comparação conceitual JPN</title><desc id="desc">Comparação entre uma solicitação vaga e uma solicitação estruturada pelo JPN, sem alegação de garantia de resultado.</desc><rect width="1920" height="1080" fill="#06121C"/><text x="120" y="120" fill="#2EC4B6" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">JPN • COMPARAÇÃO CONCEITUAL</text><text x="120" y="205" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="700">Menos ambiguidade começa na solicitação.</text><rect x="120" y="290" width="790" height="570" rx="32" fill="#0B1F33"/><rect x="1010" y="290" width="790" height="570" rx="32" fill="#0B1F33"/><text x="170" y="365" fill="#B9CAD8" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700">SOLICITAÇÃO VAGA</text><text x="1060" y="365" fill="#2EC4B6" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700">SOLICITAÇÃO ESTRUTURADA</text><g fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="30"><text x="170" y="450">“Crie uma proposta para o cliente.”</text><text x="170" y="540">• contexto ausente</text><text x="170" y="595">• restrições implícitas</text><text x="170" y="650">• formato indefinido</text><text x="1060" y="450">Jornada: objetivo e contexto</text><text x="1060" y="520">Precisão: fatos, limites e lacunas</text><text x="1060" y="590">Narrativa: formato e sequência</text><text x="1060" y="680">O método organiza a entrada;</text><text x="1060" y="730">não garante a resposta perfeita.</text></g><text x="120" y="960" fill="#B9CAD8" font-family="Inter,Arial,sans-serif" font-size="25">Estruture antes de executar. • Fonte visual interna • não publicada</text></svg>