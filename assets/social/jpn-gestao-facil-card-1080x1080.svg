<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc"><title id="title">JPN Gestão Fácil — card interno</title><desc id="desc">Card comercial interno sobre a estrutura operacional em oito abas.</desc><rect width="1080" height="1080" fill="#06121C"/><rect x="72" y="72" width="936" height="936" rx="36" fill="#0B1F33" stroke="#21455E" stroke-width="2"/><text x="112" y="142" fill="#86E2D9" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800" letter-spacing="4">JPN · GESTÃO FÁCIL</text><text x="112" y="300" fill="#F5F9FC" font-family="Inter,Arial,sans-serif" font-size="74" font-weight="900">Menos controles</text><text x="112" y="390" fill="#F5F9FC" font-family="Inter,Arial,sans-serif" font-size="74" font-weight="900">espalhados.</text><text x="112" y="500" fill="#A7BDCC" font-family="Inter,Arial,sans-serif" font-size="30">8 abas para organizar pequenas rotinas</text><text x="112" y="542" fill="#A7BDCC" font-family="Inter,Arial,sans-serif" font-size="30">empresariais em uma estrutura única.</text><g transform="translate(112 650)"><rect width="856" height="116" rx="24" fill="#0E2639" stroke="#21455E" stroke-width="2"/><text x="34" y="70" fill="#86E2D9" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="800">CONHEÇA A ESTRUTURA →</text></g><line x1="112" y1="846" x2="968" y2="846" stroke="#21455E" stroke-width="2"/><text x="112" y="910" fill="#A7BDCC" font-family="Inter,Arial,sans-serif" font-size="20">Gestão operacional · não substitui ERP, contabilidade ou sistema fiscal.</text><text x="112" y="950" fill="#A7BDCC" font-family="Inter,Arial,sans-serif" font-size="20">Arte interna · não publicada</text></svg>