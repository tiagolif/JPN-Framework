<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="t d"><title id="t">JPN Gestão Fácil — início rápido</title><desc id="d">Peça social vertical interna sobre o roteiro de início rápido da reconstrução controlada da JPN Gestão Fácil.</desc><rect width="1080" height="1350" fill="#06121C"/><text x="78" y="110" fill="#2EC4B6" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="800" letter-spacing="7">JPN</text><text x="78" y="280" fill="#F5F9FC" font-family="Inter,Arial,sans-serif" font-size="76" font-weight="900">Gestão Fácil</text><text x="78" y="350" fill="#86E2D9" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800">Comece pelo essencial.</text><text x="78" y="408" fill="#A7BDCC" font-family="Inter,Arial,sans-serif" font-size="27">Reconstrução controlada · roteiro operacional de início rápido.</text><g transform="translate(78 520)" font-family="Inter,Arial,sans-serif"><rect width="900" height="102" rx="18" fill="#0E2639" stroke="#21455E" stroke-width="4"/><text x="28" y="42" fill="#2EC4B6" font-size="21" font-weight="800" letter-spacing="2">01 · CONFIGURE</text><text x="28" y="76" fill="#F5F9FC" font-size="25" font-weight="800">Listas e estrutura antes dos lançamentos.</text><rect y="130" width="900" height="102" rx="18" fill="#0E2639" stroke="#21455E" stroke-width="4"/><text x="28" y="172" fill="#2EC4B6" font-size="21" font-weight="800" letter-spacing="2">02 · TESTE</text><text x="28" y="206" fill="#F5F9FC" font-size="25" font-weight="800">Use dados fictícios para validar o fluxo.</text><rect y="260" width="900" height="102" rx="18" fill="#0E2639" stroke="#2EC4B6" stroke-width="4"/><text x="28" y="302" fill="#2EC4B6" font-size="21" font-weight="800" letter-spacing="2">03 · CONFIRA</text><text x="28" y="336" fill="#F5F9FC" font-size="25" font-weight="800">KPIs, alertas e consistência antes da rotina real.</text></g><text x="78" y="1010" fill="#F5F9FC" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800">GF-QA-10 ainda pendente.</text><text x="78" y="1060" fill="#A7BDCC" font-family="Inter,Arial,sans-serif" font-size="25">Compatibilidade final ainda não declarada entre ambientes.</text><text x="78" y="1215" fill="#86E2D9" font-family="Inter,Arial,sans-serif" font-size="24">Fonte de design · não publicada</text></svg>