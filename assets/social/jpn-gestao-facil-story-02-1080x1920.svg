<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc"><title id="title">JPN Gestão Fácil — Story 2 de 4</title><desc id="desc">Story interno com áreas operacionais cobertas pela planilha.</desc><rect width="1080" height="1920" fill="#06121C"/><rect x="72" y="120" width="936" height="1680" rx="40" fill="#0B1F33"/><text x="120" y="220" fill="#86E2D9" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="800">JPN · GESTÃO FÁCIL · 2/4</text><text x="120" y="500" fill="#F5F9FC" font-family="Inter,Arial,sans-serif" font-size="72" font-weight="900">Centralize o essencial.</text><g font-family="Inter,Arial,sans-serif" font-size="34"><rect x="120" y="660" width="390" height="110" rx="22" fill="#0E2639"/><text x="155" y="728" fill="#F5F9FC">Clientes e vendas</text><rect x="550" y="660" width="390" height="110" rx="22" fill="#0E2639"/><text x="585" y="728" fill="#F5F9FC">Tarefas e estoque</text><rect x="120" y="810" width="390" height="110" rx="22" fill="#0E2639"/><text x="155" y="878" fill="#F5F9FC">Dashboard</text><rect x="550" y="810" width="390" height="110" rx="22" fill="#0E2639"/><text x="585" y="878" fill="#F5F9FC">Registros</text></g><text x="120" y="1070" fill="#A7BDCC" font-family="Inter,Arial,sans-serif" font-size="32">Uma base operacional para enxergar</text><text x="120" y="1120" fill="#A7BDCC" font-family="Inter,Arial,sans-serif" font-size="32">o negócio sem prometer substituir ERP.</text><text x="120" y="1600" fill="#86E2D9" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">RECONSTRUÇÃO CONTROLADA · QA MULTIPLATAFORMA PENDENTE</text><text x="120" y="1700" fill="#A7BDCC" font-family="Inter,Arial,sans-serif" font-size="22">Arte interna · não publicada</text></svg>