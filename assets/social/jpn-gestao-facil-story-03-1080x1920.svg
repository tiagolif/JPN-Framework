<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc"><title id="title">JPN Gestão Fácil — Story 3 de 4</title><desc id="desc">Story interno sobre registrar e acompanhar a operação.</desc><rect width="1080" height="1920" fill="#06121C"/><rect x="72" y="120" width="936" height="1680" rx="40" fill="#0B1F33"/><text x="120" y="220" fill="#86E2D9" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="800">JPN · GESTÃO FÁCIL · 3/4</text><text x="120" y="520" fill="#F5F9FC" font-family="Inter,Arial,sans-serif" font-size="74" font-weight="900">Registre.</text><text x="120" y="620" fill="#F5F9FC" font-family="Inter,Arial,sans-serif" font-size="74" font-weight="900">Acompanhe.</text><text x="120" y="720" fill="#F5F9FC" font-family="Inter,Arial,sans-serif" font-size="74" font-weight="900">Decida melhor.</text><text x="120" y="900" fill="#A7BDCC" font-family="Inter,Arial,sans-serif" font-size="34">Menos informação espalhada.</text><text x="120" y="950" fill="#A7BDCC" font-family="Inter,Arial,sans-serif" font-size="34">Mais contexto para a rotina.</text><rect x="120" y="1100" width="840" height="150" rx="28" fill="#0E2639" stroke="#21455E" stroke-width="2"/><text x="160" y="1165" fill="#86E2D9" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="800">ESCOPO OPERACIONAL</text><text x="160" y="1210" fill="#F5F9FC" font-family="Inter,Arial,sans-serif" font-size="26">Não substitui ERP, contabilidade ou sistema fiscal.</text><text x="120" y="1600" fill="#86E2D9" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">RECONSTRUÇÃO CONTROLADA · QA MULTIPLATAFORMA PENDENTE</text><text x="120" y="1700" fill="#A7BDCC" font-family="Inter,Arial,sans-serif" font-size="22">Arte interna · não publicada</text></svg>