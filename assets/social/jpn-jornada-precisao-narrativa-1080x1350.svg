<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Jornada, Precisão e Narrativa</title><desc id="desc">Peça conceitual dos três componentes do framework JPN.</desc><rect width="1080" height="1350" fill="#06121C"/><text x="90" y="145" fill="#2EC4B6" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">FRAMEWORK JPN</text><text x="90" y="250" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="62" font-weight="700">Três camadas.</text><text x="90" y="320" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="62" font-weight="700">Uma solicitação melhor.</text><g font-family="Inter,Arial,sans-serif"><rect x="90" y="430" width="900" height="190" rx="28" fill="#0B1F33"/><text x="130" y="495" fill="#2EC4B6" font-size="28" font-weight="700">J • JORNADA</text><text x="130" y="550" fill="#FFFFFF" font-size="30">Contexto, objetivo e caminho da tarefa.</text><rect x="90" y="650" width="900" height="190" rx="28" fill="#0B1F33"/><text x="130" y="715" fill="#2EC4B6" font-size="28" font-weight="700">P • PRECISÃO</text><text x="130" y="770" fill="#FFFFFF" font-size="30">Fatos, restrições, lacunas e critérios.</text><rect x="90" y="870" width="900" height="190" rx="28" fill="#0B1F33"/><text x="130" y="935" fill="#2EC4B6" font-size="28" font-weight="700">N • NARRATIVA</text><text x="130" y="990" fill="#FFFFFF" font-size="30">Forma, sequência e comunicação da saída.</text></g><text x="90" y="1180" fill="#B9CAD8" font-family="Inter,Arial,sans-serif" font-size="25">Estruture antes de executar.</text><text x="90" y="1230" fill="#B9CAD8" font-family="Inter,Arial,sans-serif" font-size="21">Fonte visual interna • não publicada</text></svg>