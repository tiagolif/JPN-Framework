<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="t d"><title id="t">Uma lacuna explícita é melhor que uma certeza inventada</title><desc id="d">Card educativo JPN sobre lacunas explícitas.</desc><rect width="1080" height="1080" fill="#06121C"/><text x="80" y="110" fill="#2EC4B6" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="800" letter-spacing="7">JPN</text><text x="80" y="330" fill="#F5F9FC" font-family="Inter,Arial,sans-serif" font-size="72" font-weight="900">Uma lacuna explícita</text><text x="80" y="415" fill="#F5F9FC" font-family="Inter,Arial,sans-serif" font-size="72" font-weight="900">é melhor que uma</text><text x="80" y="500" fill="#F5F9FC" font-family="Inter,Arial,sans-serif" font-size="72" font-weight="900">certeza inventada.</text><g transform="translate(80 650)"><rect width="250" height="150" rx="24" fill="#0E2639" stroke="#2EC4B6" stroke-width="4"/><rect x="290" width="250" height="150" rx="24" fill="none" stroke="#86E2D9" stroke-width="4" stroke-dasharray="16 14"/><rect x="580" width="250" height="150" rx="24" fill="#0E2639" stroke="#21455E" stroke-width="4"/><path d="M250 75H290M540 75H580" stroke="#21455E" stroke-width="5"/><text x="62" y="88" fill="#F5F9FC" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800">confirmado</text><text x="354" y="88" fill="#86E2D9" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800">lacuna</text><text x="650" y="88" fill="#F5F9FC" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800">próximo</text></g><text x="80" y="960" fill="#A7BDCC" font-family="Inter,Arial,sans-serif" font-size="27">Declare o que falta antes de transformar hipótese em fato.</text></svg>