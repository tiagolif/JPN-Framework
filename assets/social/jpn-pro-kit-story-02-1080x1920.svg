<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc"><title id="title">JPN Pro Kit — Story 2 de 4</title><desc id="desc">Use o conjunto quando vários componentes resolvem necessidades reais.</desc><rect width="1080" height="1920" fill="#06121C"/><rect x="72" y="120" width="936" height="1680" rx="40" fill="#0B1F33" stroke="#21455E" stroke-width="2"/><text x="120" y="220" fill="#86E2D9" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="800">JPN · PRO KIT · 2/4</text><text x="120" y="590" fill="#F5F9FC" font-family="Inter,Arial,sans-serif" font-size="66" font-weight="900">Quando várias peças</text><text x="120" y="685" fill="#F5F9FC" font-family="Inter,Arial,sans-serif" font-size="66" font-weight="900">fazem sentido juntas.</text><text x="120" y="890" fill="#A7BDCC" font-family="Inter,Arial,sans-serif" font-size="33">Método, ferramentas e operação</text><text x="120" y="940" fill="#A7BDCC" font-family="Inter,Arial,sans-serif" font-size="33">podem formar uma rota integrada.</text><text x="120" y="1110" fill="#86E2D9" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800">EM PREPARAÇÃO</text><line x1="120" y1="1510" x2="960" y2="1510" stroke="#21455E" stroke-width="2"/><text x="120" y="1700" fill="#A7BDCC" font-family="Inter,Arial,sans-serif" font-size="22">Arte interna · não publicada</text></svg>