<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="t d"><title id="t">JPN Prompt Builder — contexto preservado</title><desc id="d">Peça social vertical interna sobre a camada contextual candidata do JPN Prompt Builder.</desc><rect width="1080" height="1350" fill="#06121C"/><text x="78" y="110" fill="#2EC4B6" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="800" letter-spacing="7">JPN</text><text x="78" y="280" fill="#F5F9FC" font-family="Inter,Arial,sans-serif" font-size="78" font-weight="900">Prompt Builder</text><text x="78" y="350" fill="#86E2D9" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800">Contexto preservado.</text><text x="78" y="405" fill="#A7BDCC" font-family="Inter,Arial,sans-serif" font-size="28">Uma camada candidata para manter fatos e restrições visíveis.</text><g transform="translate(78 535)" font-family="Inter,Arial,sans-serif"><rect width="260" height="190" rx="18" fill="#0E2639" stroke="#21455E" stroke-width="4"/><text x="28" y="58" fill="#2EC4B6" font-size="22" font-weight="800" letter-spacing="3">JORNADA</text><text x="28" y="112" fill="#F5F9FC" font-size="28" font-weight="800">Contexto</text><text x="28" y="150" fill="#A7BDCC" font-size="21">confirmado</text><rect x="310" width="260" height="190" rx="18" fill="#0E2639" stroke="#2EC4B6" stroke-width="4"/><text x="338" y="58" fill="#2EC4B6" font-size="22" font-weight="800" letter-spacing="3">PRECISÃO</text><text x="338" y="112" fill="#F5F9FC" font-size="28" font-weight="800">Restrições</text><text x="338" y="150" fill="#A7BDCC" font-size="21">preservadas</text><rect x="620" width="260" height="190" rx="18" fill="#0E2639" stroke="#21455E" stroke-width="4"/><text x="648" y="58" fill="#2EC4B6" font-size="22" font-weight="800" letter-spacing="3">NARRATIVA</text><text x="648" y="112" fill="#F5F9FC" font-size="28" font-weight="800">Saída</text><text x="648" y="150" fill="#A7BDCC" font-size="21">orientada à tarefa</text></g><text x="78" y="880" fill="#F5F9FC" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="800">Sem rebaixar contexto informado para “não informado”.</text><text x="78" y="940" fill="#A7BDCC" font-family="Inter,Arial,sans-serif" font-size="26">Integração candidata · QA móvel real ainda pendente.</text><text x="78" y="1215" fill="#86E2D9" font-family="Inter,Arial,sans-serif" font-size="24">Fonte de design · não publicada</text></svg>