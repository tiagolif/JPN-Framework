<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc"><title id="title">JPN Prompt Builder — Story 1 de 4</title><desc id="desc">Arte interna sobre transformar pedidos vagos em instruções estruturadas.</desc><rect width="1080" height="1920" fill="#06121C"/><rect x="72" y="72" width="936" height="1776" rx="40" fill="#0E2639" stroke="#21455E" stroke-width="3"/><text x="120" y="190" fill="#86E2D9" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700">JPN PROMPT BUILDER · 1/4</text><text x="120" y="500" fill="#F5F9FC" font-family="Inter,Arial,sans-serif" font-size="72" font-weight="700"><tspan x="120" dy="0">Seu pedido para a IA</tspan><tspan x="120" dy="92">começa vago?</tspan></text><text x="120" y="760" fill="#A7BDCC" font-family="Inter,Arial,sans-serif" font-size="42"><tspan x="120" dy="0">O problema nem sempre é a IA.</tspan><tspan x="120" dy="62">Muitas vezes falta estrutura</tspan><tspan x="120" dy="62">para explicar a intenção.</tspan></text><rect x="120" y="1110" width="840" height="250" rx="28" fill="#102A3C" stroke="#21455E" stroke-width="2"/><text x="170" y="1210" fill="#86E2D9" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">PONTO DE PARTIDA</text><text x="170" y="1285" fill="#F5F9FC" font-family="Inter,Arial,sans-serif" font-size="40">“Faça algo sobre meu negócio.”</text><text x="120" y="1730" fill="#A7BDCC" font-family="Inter,Arial,sans-serif" font-size="28">Arte interna · não publicada</text></svg>