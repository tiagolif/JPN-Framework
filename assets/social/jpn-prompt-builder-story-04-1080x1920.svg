<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc"><title id="title">JPN Prompt Builder — Story 4 de 4</title><desc id="desc">Encerramento da sequência com convite informativo para conhecer a demonstração do Prompt Builder.</desc><rect width="1080" height="1920" fill="#071A2B"/><rect x="72" y="72" width="936" height="1776" rx="40" fill="#0E2639" stroke="#21455E" stroke-width="3"/><text x="120" y="190" fill="#86E2D9" font-family="Arial,sans-serif" font-size="34" font-weight="700">JPN PROMPT BUILDER · 4/4</text><text x="120" y="470" fill="#F5F9FC" font-family="Arial,sans-serif" font-size="68" font-weight="700"><tspan x="120">Da intenção</tspan><tspan x="120" dy="88">à instrução.</tspan></text><text x="120" y="760" fill="#A7BDCC" font-family="Arial,sans-serif" font-size="42"><tspan x="120">Organize o que precisa ser feito,</tspan><tspan x="120" dy="62">o contexto que importa e como</tspan><tspan x="120" dy="62">a resposta deve ser entregue.</tspan></text><rect x="120" y="1110" width="840" height="230" rx="28" fill="#86E2D9"/><text x="170" y="1200" fill="#071A2B" font-family="Arial,sans-serif" font-size="30" font-weight="700">PRÓXIMO PASSO</text><text x="170" y="1270" fill="#071A2B" font-family="Arial,sans-serif" font-size="38" font-weight="700">Conheça a demonstração guiada.</text><text x="120" y="1730" fill="#A7BDCC" font-family="Arial,sans-serif" font-size="28">Arte interna · não publicada</text></svg>