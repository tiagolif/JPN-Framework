<title id="title">JPN Prompt Pack — card interno</title><desc id="desc">Card comercial interno sobre os 18 templates do Prompt Pack.</desc><rect width="1080" height="1080" fill="#06121C"/><rect x="72" y="72" width="936" height="936" rx="36" fill="#0B1F33" stroke="#21455E" stroke-width="2"/><text x="112" y="142" fill="#86E2D9" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800" letter-spacing="4">JPN · PROMPT PACK</text><text x="112" y="300" fill="#F5F9FC" font-family="Inter,Arial,sans-serif" font-size="78" font-weight="900">Não comece toda</text><text x="112" y="390" fill="#F5F9FC" font-family="Inter,Arial,sans-serif" font-size="78" font-weight="900">tarefa do zero.</text><text x="112" y="500" fill="#A7BDCC" font-family="Inter,Arial,sans-serif" font-size="30">18 templates para servir de ponto de partida</text><text x="112" y="542" fill="#A7BDCC" font-family="Inter,Arial,sans-serif" font-size="30">em tarefas recorrentes.</text><g transform="translate(112 650)"><rect width="856" height="116" rx="24" fill="#0E2639" stroke="#21455E" stroke-width="2"/><text x="34" y="70" fill="#86E2D9" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="800">EXPLORE OS 18 TEMPLATES →</text></g><line x1="112" y1="846" x2="968" y2="846" stroke="#21455E" stroke-width="2"/><text x="112" y="930" fill="#A7BDCC" font-family="Inter,Arial,sans-serif" font-size="22">Arte interna · não publicada</text></svg>