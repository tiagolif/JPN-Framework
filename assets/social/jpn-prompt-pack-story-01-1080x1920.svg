<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc"><title id="title">JPN Prompt Pack — Story 1 de 4</title><desc id="desc">Não comece sempre do zero.</desc><rect width="1080" height="1920" fill="#06121C"/><rect x="72" y="120" width="936" height="1680" rx="40" fill="#0B1F33" stroke="#21455E" stroke-width="2"/><text x="120" y="220" fill="#86E2D9" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="800">JPN · PROMPT PACK · 1/4</text><text x="120" y="610" fill="#F5F9FC" font-family="Inter,Arial,sans-serif" font-size="72" font-weight="900">Não comece</text><text x="120" y="710" fill="#F5F9FC" font-family="Inter,Arial,sans-serif" font-size="72" font-weight="900">sempre do zero.</text><text x="120" y="900" fill="#A7BDCC" font-family="Inter,Arial,sans-serif" font-size="34">Tarefas recorrentes podem partir</text><text x="120" y="950" fill="#A7BDCC" font-family="Inter,Arial,sans-serif" font-size="34">de uma estrutura reutilizável.</text><line x1="120" y1="1510" x2="960" y2="1510" stroke="#21455E" stroke-width="2"/><text x="120" y="1700" fill="#A7BDCC" font-family="Inter,Arial,sans-serif" font-size="22">Arte interna · não publicada</text></svg>