<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Método JPN — abertura</title><desc id="desc">Primeiro card do carrossel educativo do Método JPN, com a mensagem Um pedido claro começa antes do prompt.</desc><rect width="1080" height="1350" fill="#06121C"/><text x="82" y="118" fill="#2EC4B6" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800" letter-spacing="6">MÉTODO JPN</text><text x="82" y="350" fill="#F5F9FC" font-family="Inter,Arial,sans-serif" font-size="76" font-weight="900">Um pedido claro</text><text x="82" y="440" fill="#F5F9FC" font-family="Inter,Arial,sans-serif" font-size="76" font-weight="900">começa antes</text><text x="82" y="530" fill="#F5F9FC" font-family="Inter,Arial,sans-serif" font-size="76" font-weight="900">do prompt.</text><g transform="translate(82 690)" font-family="Inter,Arial,sans-serif"><rect width="272" height="185" rx="28" fill="#0E2639" stroke="#21455E" stroke-width="4"/><text x="116" y="76" fill="#2EC4B6" font-size="38" font-weight="900">J</text><text x="62" y="125" fill="#A7BDCC" font-size="24" font-weight="700">Jornada</text><rect x="318" width="272" height="185" rx="28" fill="#0E2639" stroke="#2EC4B6" stroke-width="4"/><text x="434" y="76" fill="#2EC4B6" font-size="38" font-weight="900">P</text><text x="363" y="125" fill="#A7BDCC" font-size="24" font-weight="700">Precisão</text><rect x="636" width="272" height="185" rx="28" fill="#0E2639" stroke="#21455E" stroke-width="4"/><text x="752" y="76" fill="#2EC4B6" font-size="38" font-weight="900">N</text><text x="686" y="125" fill="#A7BDCC" font-size="24" font-weight="700">Narrativa</text></g><text x="82" y="1125" fill="#A7BDCC" font-family="Inter,Arial,sans-serif" font-size="27">Estruture a solicitação antes de executar.</text><text x="82" y="1228" fill="#86E2D9" font-family="Inter,Arial,sans-serif" font-size="23">Card 1/4 · Fonte de design · não publicada</text></svg>