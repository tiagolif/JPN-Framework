<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Método JPN — Jornada</title><desc id="desc">Segundo card do carrossel educativo do Método JPN, dedicado à camada Jornada.</desc><rect width="1080" height="1350" fill="#06121C"/><text x="82" y="118" fill="#2EC4B6" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800" letter-spacing="6">MÉTODO JPN</text><text x="82" y="310" fill="#F5F9FC" font-family="Inter,Arial,sans-serif" font-size="88" font-weight="900">Jornada</text><text x="82" y="390" fill="#A7BDCC" font-family="Inter,Arial,sans-serif" font-size="34">Contexto, recursos, restrições e lacunas.</text><g transform="translate(82 530)" font-family="Inter,Arial,sans-serif"><rect width="916" height="420" rx="32" fill="#0E2639" stroke="#21455E" stroke-width="4"/><text x="54" y="92" fill="#2EC4B6" font-size="31" font-weight="800">J • O PONTO DE PARTIDA</text><text x="54" y="175" fill="#F5F9FC" font-size="31">O que já sabemos?</text><text x="54" y="237" fill="#F5F9FC" font-size="31">Quais recursos estão disponíveis?</text><text x="54" y="299" fill="#F5F9FC" font-size="31">Quais limites precisam ser respeitados?</text><text x="54" y="361" fill="#F5F9FC" font-size="31">O que ainda está faltando?</text></g><text x="82" y="1085" fill="#A7BDCC" font-family="Inter,Arial,sans-serif" font-size="27">Torne o contexto explícito antes de avançar.</text><text x="82" y="1228" fill="#86E2D9" font-family="Inter,Arial,sans-serif" font-size="23">Card 2/4 · Fonte de design · não publicada</text></svg>