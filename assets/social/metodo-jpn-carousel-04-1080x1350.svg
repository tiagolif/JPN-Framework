<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Método JPN — Narrativa</title><desc id="desc">Quarto card do carrossel educativo do Método JPN, dedicado à camada Narrativa.</desc><rect width="1080" height="1350" fill="#06121C"/><text x="82" y="118" fill="#2EC4B6" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800" letter-spacing="6">MÉTODO JPN</text><text x="82" y="310" fill="#F5F9FC" font-family="Inter,Arial,sans-serif" font-size="88" font-weight="900">Narrativa</text><text x="82" y="390" fill="#A7BDCC" font-family="Inter,Arial,sans-serif" font-size="34">Estado final, formato e próxima ação.</text><g transform="translate(82 530)" font-family="Inter,Arial,sans-serif"><rect width="916" height="420" rx="32" fill="#0E2639" stroke="#21455E" stroke-width="4"/><text x="54" y="92" fill="#2EC4B6" font-size="31" font-weight="800">N • COMO A SAÍDA DEVE CHEGAR</text><text x="54" y="175" fill="#F5F9FC" font-size="31">Qual formato facilita o uso?</text><text x="54" y="237" fill="#F5F9FC" font-size="31">Em que ordem a informação deve aparecer?</text><text x="54" y="299" fill="#F5F9FC" font-size="31">Qual estado final é esperado?</text><text x="54" y="361" fill="#F5F9FC" font-size="31">Qual é a próxima ação depois da entrega?</text></g><text x="82" y="1085" fill="#A7BDCC" font-family="Inter,Arial,sans-serif" font-size="27">Organize a saída para facilitar a decisão e o uso.</text><text x="82" y="1228" fill="#86E2D9" font-family="Inter,Arial,sans-serif" font-size="23">Card 4/4 · Fonte de design · não publicada</text></svg>