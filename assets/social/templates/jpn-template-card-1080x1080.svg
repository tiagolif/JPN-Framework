    <rect x="232" width="92" height="92" rx="22" fill="#0E2639" stroke="#21455E" stroke-width="2"/>
    <text x="259" y="61" fill="#2EC4B6" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="900">N</text>
