<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">Template quadrado JPN</title>
  <desc id="desc">Fonte vetorial interna para princípio ou conceito curto com assinatura JPN e estado de publicação.</desc>
  <rect width="1080" height="1080" fill="#06121C"/>
  <rect x="72" y="72" width="936" height="936" rx="36" fill="#0B1F33" stroke="#21455E" stroke-width="2"/>
