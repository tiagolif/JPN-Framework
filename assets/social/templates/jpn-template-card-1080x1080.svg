  <text x="112" y="360" fill="#F5F9FC" font-family="Inter,Arial,sans-serif" font-size="86" font-weight="900">Uma ideia principal</text>
  <text x="112" y="452" fill="#F5F9FC" font-family="Inter,Arial,sans-serif" font-size="86" font-weight="900">curta e verificável</text>
