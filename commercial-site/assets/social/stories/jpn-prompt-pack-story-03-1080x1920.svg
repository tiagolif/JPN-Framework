<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc"><title id="title">JPN Prompt Pack — Story 3 de 4</title><desc id="desc">Adapte contexto e critérios ao seu caso.</desc><rect width="1080" height="1920" fill="#07151A"/><rect x="96" y="160" width="888" height="1600" rx="44" fill="#0D2229" stroke="#20D6C7" stroke-width="3"/><text x="150" y="280" fill="#20D6C7" font-family="Arial,sans-serif" font-size="34" font-weight="700">JPN PROMPT PACK</text><text x="150" y="470" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="72" font-weight="700"><tspan x="150" dy="0">Adapte contexto</tspan><tspan x="150" dy="92">e critérios</tspan><tspan x="150" dy="92">ao seu caso.</tspan></text><text x="150" y="1120" fill="#AFC5CB" font-family="Arial,sans-serif" font-size="34"><tspan x="150" dy="0">Template é ponto de partida.</tspan><tspan x="150" dy="52">O contexto real continua essencial.</tspan></text><text x="150" y="1500" fill="#AFC5CB" font-family="Arial,sans-serif" font-size="30">3/4</text><text x="150" y="1680" fill="#AFC5CB" font-family="Arial,sans-serif" font-size="26">Arte interna · não publicada</text></svg>