<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc"><title id="title">Método JPN — Story 1 de 4</title><desc id="desc">Não é só escrever mais: é organizar melhor.</desc><rect width="1080" height="1920" fill="#07151A"/><rect x="96" y="160" width="888" height="1600" rx="44" fill="#0D2229" stroke="#20D6C7" stroke-width="3"/><text x="150" y="280" fill="#20D6C7" font-family="Arial,sans-serif" font-size="34" font-weight="700">MÉTODO JPN</text><text x="150" y="470" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="72" font-weight="700"><tspan x="150" dy="0">Não é só escrever</tspan><tspan x="150" dy="92">mais: é organizar</tspan><tspan x="150" dy="92">melhor.</tspan></text><text x="150" y="1500" fill="#AFC5CB" font-family="Arial,sans-serif" font-size="30">1/4</text><text x="150" y="1680" fill="#AFC5CB" font-family="Arial,sans-serif" font-size="26">Arte interna · não publicada</text></svg>