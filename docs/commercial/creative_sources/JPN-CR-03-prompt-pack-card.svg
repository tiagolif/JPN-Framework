<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">JPN Prompt Pack — Comece de um modelo em vez de começar do zero</title>
  <desc id="desc">Candidato visual interno do JPN Prompt Pack. Catálogo dos 18 templates rastreados. Não autorizado para publicação.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#142a45"/></linearGradient></defs>
  <g id="background"><rect width="1080" height="1080" rx="52" fill="url(#bg)"/></g>
  <g id="brand" font-family="Arial, Helvetica, sans-serif"><text x="80" y="100" fill="#7dd3fc" font-size="34" font-weight="700" letter-spacing="5">JPN FRAMEWORK</text></g>
  <g id="status" font-family="Arial, Helvetica, sans-serif"><rect x="790" y="66" width="210" height="54" rx="27" fill="#ffffff" fill-opacity=".1"/><text x="895" y="101" text-anchor="middle" fill="#dbeafe" font-size="21" font-weight="700">CANDIDATO INTERNO</text></g>
  <g id="headline" font-family="Arial, Helvetica, sans-serif"><text x="80" y="230" fill="#ffffff" font-size="68" font-weight="800">JPN Prompt Pack</text><text x="80" y="300" fill="#bae6fd" font-size="34">Comece de um modelo em vez de começar do zero.</text></g>
  <g id="visual-proof" font-family="Arial, Helvetica, sans-serif">
    <rect x="80" y="380" width="920" height="390" rx="34" fill="#ffffff" fill-opacity=".06" stroke="#7dd3fc" stroke-opacity=".4"/>
    <text x="125" y="440" fill="#94a3b8" font-size="22" font-weight="700">CATÁLOGO RASTREADO</text><text x="930" y="440" text-anchor="end" fill="#7dd3fc" font-size="28" font-weight="800">18 TEMPLATES</text>
    <g fill="#e0f2fe" font-size="23">
      <text x="125" y="505">01</text><text x="225" y="505">02</text><text x="325" y="505">03</text><text x="425" y="505">04</text><text x="525" y="505">05</text><text x="625" y="505">06</text>
      <text x="125" y="585">07</text><text x="225" y="585">08</text><text x="325" y="585">09</text><text x="425" y="585">10</text><text x="525" y="585">11</text><text x="625" y="585">12</text>
      <text x="125" y="665">13</text><text x="225" y="665">14</text><text x="325" y="665">15</text><text x="425" y="665">16</text><text x="525" y="665">17</text><text x="625" y="665">18</text>
    </g>
    <text x="930" y="535" text-anchor="end" fill="#dbeafe" font-size="24">Escolha</text><text x="930" y="600" text-anchor="end" fill="#dbeafe" font-size="24">Adapte</text><text x="930" y="665" text-anchor="end" fill="#dbeafe" font-size="24">Revise</text>
    <path d="M125 715 H930" stroke="#7dd3fc" stroke-opacity=".3"/><text x="125" y="750" fill="#94a3b8" font-size="18">A representação visual não adiciona templates além dos 18 existentes.</text>
  </g>
  <g id="support" font-family="Arial, Helvetica, sans-serif"><text x="80" y="845" fill="#dbeafe" font-size="29">Templates organizados para adaptar instruções a situações recorrentes.</text></g>
  <g id="microcopy" font-family="Arial, Helvetica, sans-serif"><text x="80" y="930" fill="#bae6fd" font-size="27" font-weight="700">Escolha. Adapte. Revise.</text><text x="80" y="975" fill="#94a3b8" font-size="20">Material de demonstração • revisão humana pendente • não publicar</text></g>
  <g id="cta-internal" font-family="Arial, Helvetica, sans-serif"><text x="1000" y="1018" text-anchor="end" fill="#7dd3fc" font-size="20" font-weight="700">JPN-CR-03</text></g>
</svg>