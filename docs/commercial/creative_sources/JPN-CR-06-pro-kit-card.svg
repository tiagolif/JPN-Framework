 <g fill="#E2E8F0" font-size="18" font-weight="700" text-anchor="middle"><text x="191" y="552">ENTENDER</text><text x="363" y="552">ESTRUTURAR</text><text x="535" y="552">APLICAR</text><text x="707" y="552">OPERAR</text><text x="879" y="552">INTEGRAR</text></g>
 <g fill="#94A3B8" font-size="15" text-anchor="middle"><text x="191" y="584">Método JPN</text><text x="363" y="584">Prompt Builder</text><text x="535" y="584">Prompt Pack</text><text x="707" y="584">JPN Business</text><text x="879" y="584">Pro Kit</text></g>
 <path d="M191 660 H879" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/><circle cx="191" cy="660" r="9" fill="#7DD3FC"/><circle cx="363" cy="660" r="9" fill="#7DD3FC"/><circle cx="535" cy="660" r="9" fill="#7DD3FC"/><circle cx="707" cy="660" r="9" fill="#7DD3FC"/><circle cx="879" cy="660" r="9" fill="#7DD3FC"/>
 <rect x="112" y="718" width="846" height="70" rx="16" fill="#172554"/><text x="535" y="748" text-anchor="middle" fill="#BAE6FD" font-size="17" font-weight="700">INTEGRAÇÃO EM CONSTRUÇÃO</text><text x="535" y="774" text-anchor="middle" fill="#94A3B8" font-size="16">A composição visual não representa disponibilidade comercial ou release aprovado.</text>
