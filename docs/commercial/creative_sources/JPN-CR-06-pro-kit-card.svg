<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
<title id="title">JPN Pro Kit — ecossistema integrado de aplicação</title>
<desc id="desc">Candidato interno JPN-CR-06. Representa a integração dos produtos JPN sem alegar release ou disponibilidade comercial. Pro Kit permanece EM PREPARAÇÃO e não autorizado para publicação.</desc>
<rect id="background" width="1080" height="1080" fill="#0B1020"/>
<g id="brand" font-family="Arial, Helvetica, sans-serif">
 <text x="76" y="92" fill="#FFFFFF" font-size="30" font-weight="700">JPN</text><text x="145" y="92" fill="#7DD3FC" font-size="30">PRO KIT</text>
</g>
<g id="status" font-family="Arial, Helvetica, sans-serif">
 <rect x="770" y="55" width="230" height="54" rx="27" fill="#172554" stroke="#38BDF8"/><text x="885" y="90" text-anchor="middle" fill="#BAE6FD" font-size="18" font-weight="700">EM PREPARAÇÃO</text>
</g>
<g id="headline" font-family="Arial, Helvetica, sans-serif">
 <text x="76" y="205" fill="#FFFFFF" font-size="58" font-weight="700">Do método à operação.</text>
 <text x="76" y="272" fill="#FFFFFF" font-size="58" font-weight="700">Um ecossistema conectado.</text>
 <text x="76" y="330" fill="#CBD5E1" font-size="24">Materiais JPN organizados para entender, estruturar, aplicar, operar e integrar.</text>
</g>
