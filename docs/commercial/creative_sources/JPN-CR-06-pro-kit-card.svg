<g id="microcopy" font-family="Arial, Helvetica, sans-serif"><text x="76" y="888" fill="#FFFFFF" font-size="27" font-weight="700">Entender → Estruturar → Aplicar → Operar → Integrar</text><text x="76" y="932" fill="#94A3B8" font-size="19">Pro Kit permanece EM PREPARAÇÃO até conclusão dos gates e revisão humana.</text><text x="76" y="968" fill="#94A3B8" font-size="18">Sem promessa de resultado, preço, desconto ou CTA transacional.</text></g>
<g id="cta-internal" font-family="Arial, Helvetica, sans-serif"><text x="76" y="1025" fill="#7DD3FC" font-size="18" font-weight="700">JPN-CR-06 • FONTE EDITÁVEL • REVISÃO HUMANA PENDENTE • NÃO PUBLICAR</text></g>
